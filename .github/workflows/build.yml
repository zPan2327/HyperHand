name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不再使用 android-actions/setup-android：GitHub 托管的 ubuntu 镜像已内置
      # Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），自带 build-tools 与
      # platforms，那一步反而常因 cmdline-tools 下载地址变化而失败。
      - name: Resolve Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "找不到 Android SDK: $SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK"
          ls "$SDK/build-tools"
          ls "$SDK/platforms"

      # 可选：仓库 Secrets 里配置 ANDROID_KEYSTORE_B64（onehand.keystore 的 base64）
      # 后，CI 产出的 APK 与本地构建同签名，可以直接覆盖安装。
      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p module/signing
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > module/signing/onehand.keystore
            echo "使用仓库 secret 中的签名密钥"
          else
            echo "未配置 ANDROID_KEYSTORE_B64，本次使用临时签名密钥"
          fi

      - name: Build APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          # build-tools：优先用 36.0.0，缺失则退到镜像里最新的一版
          BT="${BUILD_TOOLS_VERSION:-36.0.0}"
          if [ ! -d "$SDK/build-tools/$BT" ]; then
            BT="$(ls "$SDK/build-tools" | sort -V | tail -1)"
          fi

          # platform：优先 android-35，缺失则退到最新的正式版
          PLATFORM="${PLATFORM_VERSION:-35}"
          if [ ! -f "$SDK/platforms/android-$PLATFORM/android.jar" ]; then
            PLATFORM="$(ls "$SDK/platforms" | sed -n 's/^android-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
          fi

          # tag 构建时把版本号写进 APK
          VERSION_NAME="${VERSION_NAME:-}"
          if [ -z "$VERSION_NAME" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi

          echo "sdk=$SDK build-tools=$BT platform=$PLATFORM version=${VERSION_NAME:-1.0}"

          chmod +x module/build.sh
          BUILD_TOOLS_VERSION="$BT" \
          PLATFORM_VERSION="$PLATFORM" \
          VERSION_NAME="${VERSION_NAME:-1.0}" \
          ./module/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneHandTuner-apk
          path: module/out/OneHandTuner.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: module/out/OneHandTuner.apk
          generate_release_notes: true
