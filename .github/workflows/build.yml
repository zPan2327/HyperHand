name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      # 手动补发时必须显式给版本号：不带 tag 的 workflow_dispatch 拿不到 GITHUB_REF_NAME，
      # 早先会一路退到默认的 2.0.0，把 release 打成 20000-2.0.0 发进模块仓库。
      version:
        description: '版本号（如 2.9.9）；推送 v* 标签时忽略此项'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  # 用于把构建产物同步到 Xposed-Modules-Repo/io.github.zpan2327.hyperhand。
  # 没配置这个 secret 时，发布步骤会自动跳过，不影响主流程。
  MODULE_REPO_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不再使用 android-actions/setup-android：GitHub 托管的 ubuntu 镜像已内置
      # Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），自带 build-tools 与
      # platforms，那一步反而常因 cmdline-tools 下载地址变化而失败。
      # Gradle 缓存：底栏带上了 Compose + miuix，冷构建要拉两百多兆依赖。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "找不到 Android SDK: $SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK"
          ls "$SDK/build-tools"
          ls "$SDK/platforms"

      # compileSdk 是 37（miuix 0.9.4 的 AAR 声明 minCompileSdk=37）。这个平台在 SDK 仓库里的
      # 包名是 "platforms;android-37.0"、落地目录是 platforms/android-37.0，不是 android-37：
      # 写错包名 sdkmanager 会直接退出 1，写错目录则明明装好了还会重装。
      - name: Ensure SDK platform 37
        run: |
          set -x
          SDK="$ANDROID_HOME"
          PLATFORM_JAR=""
          for dir in android-37.0 android-37; do
            if [ -f "$SDK/platforms/$dir/android.jar" ]; then
              PLATFORM_JAR="$SDK/platforms/$dir/android.jar"
              break
            fi
          done
          if [ -z "$PLATFORM_JAR" ]; then
            SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
            [ -n "$SDKMANAGER" ] || { echo "找不到 sdkmanager" >&2; exit 1; }
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
            for pkg in "platforms;android-37.0" "platforms;android-37"; do
              echo "尝试安装 $pkg"
              if yes | "$SDKMANAGER" --sdk_root="$SDK" "$pkg"; then break; fi
            done
            for dir in android-37.0 android-37; do
              if [ -f "$SDK/platforms/$dir/android.jar" ]; then
                PLATFORM_JAR="$SDK/platforms/$dir/android.jar"
                break
              fi
            done
            [ -n "$PLATFORM_JAR" ] || { echo "platform 37 安装失败" >&2; exit 1; }
          fi
          echo "使用 $PLATFORM_JAR"
          ls "$SDK/platforms"

      # 可选：仓库 Secrets 里配置 ANDROID_KEYSTORE_B64（hyperhand.keystore 的 base64）
      # 后，CI 产出的 APK 与本地构建同签名，可以直接覆盖安装。
      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p module/signing
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > module/signing/hyperhand.keystore
            echo "使用仓库 secret 中的签名密钥"
          else
            echo "未配置 ANDROID_KEYSTORE_B64，本次使用临时签名密钥"
          fi

      - name: Build APK
        id: apk
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # 版本号来源优先级：显式传入 > tag 名 > 手动补发输入。
          # 发布场景（tag / 手动补发）必须能确定版本号；普通 main / PR 构建没有版本语义，
          # 交给 build.gradle.kts 的默认值，别把日常 CI 拦下来。
          VERSION_NAME="${VERSION_NAME:-}"
          if [ -z "$VERSION_NAME" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION_NAME" ] && [ -n "${DISPATCH_VERSION:-}" ]; then
            VERSION_NAME="${DISPATCH_VERSION#v}"
          fi
          if [ -z "$VERSION_NAME" ] && { [ "${GITHUB_REF_TYPE:-}" = "tag" ] || [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; }; then
            echo "发布构建但无法确定版本号：推 v* 标签，或手动触发时填写 version 输入" >&2
            exit 1
          fi

          echo "version=${VERSION_NAME:-<gradle 默认值>}"

          chmod +x gradlew module/build.sh
          # 空值不导出，让 build.gradle.kts 用自己脚本里的默认版本
          if [ -n "$VERSION_NAME" ]; then export VERSION_NAME; fi
          ./gradlew --console=plain :module:assembleHyperHand

          APK=module/out/HyperHand.apk
          # 镜像里可能装了好几个 build-tools，通配符会展开成多个路径，
          # 第二个 aapt2 路径会被当成子命令（error: unknown subcommand ... → 退出码 255）。
          # 只挑一个，并且不要 `| head -1`（pipefail 下 aapt2 会被 SIGPIPE 判失败）。
          BT="$(ls "$SDK/build-tools" | sort -V | tail -1)"
          BADGING="$("$SDK/build-tools/$BT/aapt2" dump badging "$APK")"
          VC="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          VN="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          echo "built $APK versionCode=$VC versionName=$VN"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"

          # 结构性自检：libxposed 现代 API 必须有这三个文件，否则框架不会认这个模块
          for f in META-INF/xposed/java_init.list META-INF/xposed/scope.list META-INF/xposed/module.prop; do
            unzip -l "$APK" "$f" | grep -q "$f" || { echo "APK 缺少 $f" >&2; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperHand-apk
          path: module/out/HyperHand.apk
          if-no-files-found: error

      # 打 v*-beta.* 标签只发预发布版：GitHub Release 标成 prerelease，
      # 且不写 latest —— 正式版（v2.9.10 等）在 Releases 页面上仍是最新可用版本，
      # 不会被一个测试构建顶掉。
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: module/out/HyperHand.apk
          generate_release_notes: true
          prerelease: ${{ contains(steps.apk.outputs.version_name, 'beta') }}
          make_latest: ${{ contains(steps.apk.outputs.version_name, 'beta') && 'false' || 'true' }}

      # 同步到官方模块仓库：repo 名必须等于包名，release tag 必须是 VersionCode-VersionName。
      # 需要先在仓库 Secrets 里配置 MODULE_REPO_TOKEN（对 Xposed-Modules-Repo/io.github.zpan2327.hyperhand
      # 有写权限的 PAT），否则这一步跳过。
      #
      # 预发布版（版本名含 beta）绝不推模块仓库：那是正式的分发通道，
      # 一旦推进去，所有用户都会被提示"有更新"。
      - name: Publish to Xposed-Modules-Repo
        # 打正式 tag 时自动同步；也允许手动 Run workflow 补发。
        # 判据用 Build 步骤输出的 version_name（始终是字符串）而不是 inputs.version：
        # 后者在 push 事件下是 null，contains(null, ...) 不可靠。
        if: >-
          (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
          && env.MODULE_REPO_TOKEN != ''
          && !contains(steps.apk.outputs.version_name, 'beta')
        # 模块仓库还没创建/还没批准时，这一步 404 属于预期，不要因此把整个构建标红
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: Xposed-Modules-Repo/io.github.zpan2327.hyperhand
          token: ${{ env.MODULE_REPO_TOKEN }}
          tag_name: ${{ steps.apk.outputs.version_code }}-${{ steps.apk.outputs.version_name }}
          name: HyperHand ${{ steps.apk.outputs.version_name }}
          body: |
            HyperHand ${{ steps.apk.outputs.version_name }}（versionCode ${{ steps.apk.outputs.version_code }}）

            单手模式增强：扩大底部触发区、按速度判定下滑、与下拉通知/控制中心互斥，
            缩小动画 / 布局 / 触摸映射 / 退出方式全部沿用 HyperOS 原生实现。

            需要支持 libxposed API 102 的框架（Vector / 新版 LSPosed）。
          files: module/out/HyperHand.apk
